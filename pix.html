<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Pagamento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-container {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .loading-message {
            font-size: 1rem;
            color: #718096;
            margin-bottom: 20px;
        }

        .loading-details {
            background: #f7fafc;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        .loading-details p {
            font-size: 0.9rem;
            color: #4a5568;
            margin: 5px 0;
        }

        .loading-details strong {
            color: #2d3748;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            animation: progress 2s ease-in-out infinite;
            width: 30%;
        }

        @keyframes progress {
            0% { width: 30%; }
            50% { width: 70%; }
            100% { width: 30%; }
        }

        .status-text {
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .success-check {
            display: none;
            color: #48bb78;
            font-size: 3rem;
            margin: 10px auto;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner" id="spinner"></div>
        <div class="success-check" id="successCheck">✓</div>
        
        <h1 class="loading-title" id="loadingTitle">Processando pagamento...</h1>
        <p class="loading-message">Aguarde, redirecionando para finalizar sua transação.</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <p class="status-text" id="statusText">Conectando...</p>
        
        <div class="loading-details" id="detailsBox" style="display: none;">
            <p><strong>Nome:</strong> <span id="displayName"></span></p>
            <p><strong>Telefone:</strong> <span id="displayPhone"></span></p>
        </div>
    </div>

    <script>
        // Configurações
        const API_URL = 'https://api.sheetmonkey.io/form/f3C7T9jcLcFe4xskRKCzX1';
        const REDIRECT_PAGE = '1pix.html';

        // Obtém apenas nome e telefone da URL
        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                nome: params.get('nome') || '',
                telefone: params.get('telefone') || ''
            };
        }

        // Formata telefone para exibição
        function formatPhone(phone) {
            if (!phone) return '';
            const clean = phone.replace(/\D/g, '');
            if (clean.length === 11) {
                return `(${clean.substring(0,2)}) ${clean.substring(2,7)}-${clean.substring(7)}`;
            }
            return phone;
        }

        // Atualiza texto de status
        function updateStatus(msg) {
            document.getElementById('statusText').textContent = msg;
        }

        // Envia APENAS nome e telefone para a API
        async function sendToAPI(nome, telefone) {
            try {
                updateStatus('Enviando...');
                
                // Payload mínimo: apenas os dois campos solicitados
                const payload = {
                    nome: nome,
                    telefone: telefone
                };

                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                return true;
            } catch (e) {
                // Silencioso: não bloqueia o fluxo em caso de erro
                return true;
            }
        }

        // Redireciona preservando os parâmetros na URL
        function redirect(nome, telefone) {
            updateStatus('Redirecionando...');
            
            const params = new URLSearchParams();
            if (nome) params.append('nome', nome);
            if (telefone) params.append('telefone', telefone);
            
            const query = params.toString();
            const url = query ? `${REDIRECT_PAGE}?${query}` : REDIRECT_PAGE;
            
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }

        // Fluxo principal
        async function init() {
            const { nome, telefone } = getParams();

            // Exibe dados na tela
            setTimeout(() => {
                if (nome) document.getElementById('displayName').textContent = nome;
                if (telefone) document.getElementById('displayPhone').textContent = formatPhone(telefone);
                if (nome || telefone) document.getElementById('detailsBox').style.display = 'block';
            }, 600);

            // Tempo mínimo de carregamento
            await new Promise(r => setTimeout(r, 1500));

            // Envia para API (apenas nome e telefone)
            await sendToAPI(nome, telefone);

            // Feedback visual de sucesso
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('successCheck').style.display = 'block';
            document.getElementById('loadingTitle').textContent = 'Quase lá!';

            // Redireciona com os parâmetros
            redirect(nome, telefone);
        }

        // Inicia
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
