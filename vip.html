<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Link VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f2f2f2;
    color: #333;
}

.container {
    max-width: 560px;
    margin: 30px auto;
    background: #fff;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    text-align: center;
    margin-bottom: 20px;
}

label {
    font-size: 13px;
    font-weight: 500;
    display: block;
    margin-top: 14px;
}

input, textarea {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #e91e63, #c2185b);
    color: #fff;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    padding: 14px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
}

.copy {
    margin-top: 8px;
    font-size: 13px;
    color: #d81b60;
    cursor: pointer;
    text-align: right;
}
</style>
</head>

<body>

<div class="container">
    <h1>Gerador de Link VIP</h1>

    <label>Link base do site</label>
    <input id="base" value="https://fatalmodelo.netlify.app/index.html">

    <label>Link da foto (imagem)</label>
    <input id="foto" placeholder="https://i.postimg.cc/...jpg">

    <label>Nome da pessoa</label>
    <input id="nome" placeholder="Ex: Clara">

    <label>Telefone</label>
    <input id="telefone" placeholder="Ex: 11999999999">

    <button onclick="gerar()">Gerar Link</button>

    <div class="result">
        <label>Link final</label>
        <textarea id="linkFinal" readonly></textarea>
        <div class="copy" onclick="copiar('linkFinal')">Copiar link</div>
    </div>

    <div class="result">
        <label>Mensagem pronta para WhatsApp</label>
        <textarea id="mensagem" readonly></textarea>
        <div class="copy" onclick="copiar('mensagem')">Copiar mensagem</div>
    </div>
</div>

<script>
function gerar() {
    const base = document.getElementById('base').value.trim();
    const nome = document.getElementById('nome').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const foto = document.getElementById('foto').value.trim();

    if (!base || !nome || !telefone || !foto) {
        alert("Preencha todos os campos.");
        return;
    }

    const link =
        base +
        "?nome=" + encodeURIComponent(nome) +
        "&telefone=" + encodeURIComponent(telefone) +
        "&foto=" + encodeURIComponent(foto);

    document.getElementById('linkFinal').value = link;

    const msg =
`Olá ${nome}, tudo bem? 👋

Você foi selecionada para ativar o *Plano Premium VIP* com valor promocional de apenas *R$ 5,99 (pagamento único)*.

✨ Benefícios exclusivos:
✔️ Selo VIP
✔️ Destaque máximo no perfil
✔️ Prioridade em anúncios
✔️ Participação em sorteios

Acesse seu link personalizado 👇
${link}

⚠️ Oferta limitada e exclusiva para você.
Qualquer dúvida estou à disposição.`;

    document.getElementById('mensagem').value = msg;
}

function copiar(id) {
    const el = document.getElementById(id);
    el.select();
    document.execCommand("copy");
    alert("Copiado com sucesso!");
}
</script>

</body>
</html>
